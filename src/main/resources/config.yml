# ============================================================
#  WorldBackUp - 자동 백업 / 롤백 플러그인 (Minecraft 26.2)
#  값을 바꾼 뒤에는 /wb reload 를 실행하세요.
# ============================================================

backup:
  # 자동(주기) 백업 사용 여부
  enabled: true

  # 백업 방식
  #   full         - 매번 전체를 압축합니다. 백업 하나가 독립적이라 가장 단순합니다.
  #   differential - 전체 백업 하나를 기준으로, 이후에는 바뀐 파일만 저장합니다.
  #                  월드가 크고 주기가 짧을수록 효과가 큽니다.
  #                  (예: 10GB 월드 30분 주기 -> 차등본 하나에 수십~수백 MB)
  #
  # 차등 백업은 "기준 전체 백업 + 차등본" 두 개가 있어야 복원됩니다.
  # 기준 백업은 딸린 차등본이 모두 정리되기 전까지 자동 삭제되지 않으며,
  # /wb list 에서 [차등] 으로 표시됩니다.
  #
  # ※ 기본값이 differential 인 이유: 아래 retention.tiers 기본값이 27개를 남깁니다.
  #    full 이면 그 27개가 전부 "월드 한 벌씩" 이라 디스크가 먼저 차고, 계단이 약속한
  #    시간대는 만들어지지도 못한 채 오래된 것부터 계속 지워집니다.
  #    full 로 쓰시려면 tiers 의 keep 값을 크게 줄이거나 tiers 를 비우세요.
  mode: differential

  # 차등 백업을 이 개수만큼 만들면 전체 백업을 다시 만듭니다. (0 = 자동 재생성 안 함)
  # 30분 주기 기준으로 24 는 하루에 한 번 전체 백업을 뜻합니다.
  # mode: full 이면 무시됩니다.
  full-every: 24

  # 백업 주기 (분). 예) 30 = 30분마다
  interval-minutes: 30

  # 서버 시작 후 첫 자동 백업까지의 대기 시간 (분)
  initial-delay-minutes: 10

  # 서버가 켜질 때 한 번 백업할지 여부
  on-startup: false

  # 서버가 꺼질 때 백업할지 여부.
  # 켜면 종료가 백업 시간만큼 늦어집니다. 호스팅 패널이 종료를 강제로
  # 끊는 환경에서는 false 를 권장합니다.
  on-shutdown: false

  # 아무도 접속하지 않았고 마지막 백업 이후 변경이 없으면 자동 백업을 건너뜁니다.
  skip-if-no-players: true

  # 위 설정으로 연속해서 이 횟수만큼 건너뛰면, 변경이 없어 보여도 한 번은 백업합니다.
  # (0 = 무제한 건너뛰기)
  #
  # "변경 없음" 판단은 블록 설치·파괴·접속만 보고 내립니다. 강제 로드된 청크에서 도는
  # 농장이나 플러그인이 직접 쓰는 데이터는 잡히지 않아서, 그대로 두면 무인 기간의 백업이
  # 통째로 비어 버립니다. 하필 그 사이에 서버가 죽으면 되돌릴 지점이 없습니다.
  # 48 은 30분 주기 기준 "적어도 하루에 한 번" 이라는 뜻입니다.
  max-skipped-cycles: 48

  # 청크 쓰기를 미리 걸어 두고 큐가 빠지기를 기다릴 시간 (초). 0 = 예열 안 함
  #
  # 백업이 서버를 멈추는 시간의 대부분은 청크를 만드는 비용이 아니라, 이미 큐에 쌓인 쓰기가
  # 디스크로 내려가기를 "기다리는" 것입니다. 워치독이 남기는 스레드 덤프에
  # MoonriseRegionFileIO.partialFlush 의 linearLongBackoff 로 찍히는 그 대기입니다.
  #
  # 그래서 기다리기 전에 쓰기를 미리 걸어 두고, 서버가 정상적으로 도는 동안 I/O 스레드가
  # 그것을 내려쓰게 둡니다. 이 시간 동안 서버는 멈추지 않습니다 — 잠드는 것은 백업
  # 스레드뿐입니다. 그 뒤의 실제 저장은 그 사이에 새로 더러워진 청크만 기다리면 됩니다.
  #
  # 디스크가 느리거나 월드가 크면 늘리세요. 백업 한 번이 그만큼 늦게 끝날 뿐,
  # 서버가 멈추는 시간은 오히려 줄어듭니다.
  flush-settle-seconds: 3

  # zip 압축 레벨 0(무압축) ~ 9(최대 압축)
  #
  # region 파일(.mca)처럼 이미 압축된 형식은 이 값과 무관하게 무압축으로 담습니다.
  # 마인크래프트는 청크를 zlib 으로 눌러 저장하므로, 그 위에 압축을 한 번 더 걸면
  # 크기는 그대로인데 CPU 만 몇 배로 먹습니다. (측정: region 부분만 14배 느려지고 절감 0%)
  # 그래서 이 값은 실제로 이득이 나는 곳 - level.dat 같은 설정, JSON/YAML, 텍스트 -
  # 에만 적용됩니다. 그쪽은 98% 이상 줄어들면서 비용이 거의 없습니다.
  #
  # 결과적으로 이 값을 올려도 백업이 크게 작아지지도, 크게 느려지지도 않습니다.
  # 기본값을 그대로 두시면 됩니다.
  compression-level: 4

  # 백업 저장 폴더.
  # 상대 경로면 plugins/WorldBackUp/ 기준, 절대 경로면 그대로 씁니다.
  #
  #   directory: "backups"              -> plugins/WorldBackUp/backups/  (기본값)
  #   directory: "../../worldbackups"   -> 서버폴더/worldbackups/        (plugins 밖)
  #   directory: "D:/minecraft-backups" -> 그 경로 그대로               (다른 디스크·권장)
  #
  # plugins/ 밖에 두면 플러그인을 지우거나 다시 설치할 때 백업이 함께 날아가지 않고,
  # plugins/ 를 통째로 다루는 호스팅 패널·동기화 스크립트에도 걸리지 않습니다.
  # 어디에 두든 그 폴더는 백업 대상에서 자동으로 빠집니다(백업이 자기를 삼키지 않도록).
  #
  # ※ 값을 바꿔도 이미 만들어진 백업은 따라오지 않습니다. 옮기려면 서버를 끄고 zip·yml·locked
  #   파일을 함께 새 폴더로 옮긴 뒤 /wb list 로 확인하세요.
  directory: "backups"

  # 백업 시작/완료를 채팅으로 알릴지 여부
  broadcast: true

  # true 면 worldbackup.notify 권한이 있는 사람에게만 알립니다.
  broadcast-permission-only: true

targets:
  # 백업할 월드. "*" 는 서버에 로드된 모든 월드입니다.
  # 특정 월드만 원하면 예) worlds: ["world", "world_nether"]
  # ※ 플레이어 인벤토리/좌표/업적/통계는 메인 월드 폴더(world/playerdata 등)에
  #    들어 있으므로 메인 월드는 반드시 포함하세요.
  worlds: ["*"]

  # 서버 루트에 있는 개별 파일들
  server-files:
    - "server.properties"
    - "ops.json"
    - "whitelist.json"
    # ※ 밴 목록은 백업에는 담기지만 복원 때는 덮어쓰지 않습니다.
    #    이 플러그인을 쓰는 가장 흔한 순간이 "테러범을 밴하고 그 전으로 되돌리는" 것인데,
    #    밴까지 되돌리면 방금 건 밴이 함께 풀려 같은 사람이 곧바로 다시 들어옵니다.
    #    밴한 사람은 복원 뒤에도 그대로 밴입니다. (서버를 통째로 잃었을 때 쓸 수 있도록
    #    백업에는 계속 담기므로, 필요하면 zip 에서 직접 꺼내 쓰면 됩니다)
    - "banned-players.json"
    - "banned-ips.json"
    - "usercache.json"
    - "bukkit.yml"
    - "spigot.yml"
    - "permissions.yml"

  # 플러그인 폴더(plugins/)를 함께 백업할지.
  #
  #   all  - jar 와 설정·데이터를 전부 담습니다 (기본값)
  #   data - 설정과 데이터만. plugins/ 바로 아래의 jar 는 빼고 담습니다
  #   none - 담지 않습니다
  #
  # 월드만 되돌리면 경제 잔고·보호구역·권한처럼 플러그인이 들고 있는 상태는 그대로 남아
  # 월드와 어긋납니다. 되돌린 시점에는 없던 상점 거래가 그대로 살아 있고, 사라진 건물의
  # 보호구역이 그대로 남는 식입니다. 그래서 기본값은 함께 담는 쪽입니다.
  #
  # ※ jar 는 백업에 담기지만 복원할 때는 덮어쓰지 않습니다.
  #    복원은 월드가 올라오기 전(onLoad)에 도는데, 그 시점에는 서버가 이미 모든 플러그인
  #    jar 를 열어 둔 뒤입니다. 윈도우에서는 파일이 잠겨 실패하고, 리눅스에서는 성공해도
  #    이번 세션에는 아무 효과가 없이 다음 재시작에 조용히 옛 버전으로 돌아갑니다.
  #    게다가 사흘 전으로 되돌릴 때 원하는 것은 대개 "지금 코드 + 그때 데이터" 이지
  #    사흘 전 버전의 플러그인이 아닙니다.
  #    서버를 통째로 잃었을 때 쓸 수 있도록 담기기는 하므로, 필요하면 zip 에서 직접 꺼내세요.
  #
  # ※ 데이터베이스를 열어 둔 채 쓰는 플러그인(SQLite/H2 등)은 백업 순간의 파일이 잘려
  #    있을 수 있습니다. 그런 폴더는 아래 exclude 에 넣으세요.
  #
  # ※ 복원은 이 폴더도 "백업 시점 그대로" 만듭니다. 백업한 뒤에 설치한 플러그인의 데이터
  #    폴더는 사라집니다(jar 는 위 규칙으로 남습니다). restore.keep-replaced-files 가
  #    켜져 있으면 plugins/WorldBackUp/replaced/ 로 옮겨 두므로 되찾을 수 있습니다.
  plugins: all

  # 추가로 백업할 경로 (서버 루트 기준 상대 경로).
  # 위 plugins 와 worlds 로 덮이지 않는 곳을 넣습니다.
  # 예)
  #   - "config"
  #
  # plugins/ 아래를 적어도 됩니다. 위 plugins 설정이 이미 담고 있으면 말없이 합쳐집니다
  # (예전 설정을 그대로 두어도 경고가 쌓이지 않도록).
  extra-paths: []

  # ※ 이 파일(plugins/WorldBackUp/config.yml)은 위 설정과 무관하게 항상 백업에 담깁니다.
  #    담지 않으면 서버를 되돌려도 그 시점의 보관 정책은 되돌아오지 않습니다 -
  #    백업이 어떻게 만들어졌는지가 정작 백업 안에 없는 셈입니다.
  #    (복원할 때 이 파일도 그 시점 것으로 바뀝니다. 그 뒤 backup.directory 같은 값이
  #     예전으로 돌아갈 수 있으니, 복원 후 /wb status 로 한 번 확인하세요.)
  #    원치 않으면 아래 exclude 에 "plugins/WorldBackUp/config.yml" 을 넣으세요.
  #
  #    플러그인이 스스로 만들어 쓰는 나머지(backups/, replaced/, 복원 예약·실패 표식)는
  #    반대로 절대 담기지 않습니다. 담기면 복원이 그것을 되살리는데, 복원 예약이 되살아나면
  #    다음 부팅이 또 복원하고, 실패 표식이 되살아나면 자동 백업이 영구히 멈춥니다.

  # 백업에서 제외할 경로 패턴 (glob). 상대 경로에 대해 매칭됩니다.
  exclude:
    - "**/session.lock"
    - "**/*.lock"
    - "**/logs/**"
    - "**/crash-reports/**"
    - "**/cache/**"
    - "**/*.log"
    - "**/*.log.gz"
    - "plugins/WorldBackUp/backups/**"
    # 서버가 손상된 region 파일을 고치면서 남기는 사본입니다.
    # (r.0.0.mca.-5062505702693227547.backup 같은 이름)
    # 스스로 지우지 않고 계속 쌓이는데 region 파일만큼 커서, 빼지 않으면 백업이 두 배가 됩니다.
    - "**/*.mca.*.backup"

retention:
  # ── 계단식 보관 (권장) ────────────────────────────────────────────
  # 최근일수록 촘촘히, 오래될수록 성기게 남깁니다.
  # 설정하면 아래 max-backups / max-age-days / keep-daily 를 대신합니다.
  # (min-backups, protect-manual, /wb lock 은 안전장치라 계단과 무관하게 계속 동작합니다)
  #
  # every: 구간 간격 (0 = 시간과 무관하게 최신 것부터),  keep: 남길 개수
  #
  # 아래 기본값은 "자는 동안 테러당하고 아침에 발견" 을 견디는 배치입니다.
  # 지난 반나절을 1시간 단위로 남기므로, 새벽 3시 사고를 정오에 알아채도
  # 사고 직전 1시간 이내로 되돌아갈 수 있습니다.
  # 위 interval-minutes: 30 기준 총 27개로 약 16일이 덮입니다.
  #
  # ※ every: 0 계단만은 시간이 아니라 개수로 세므로, 그 계단이 덮는 시간은
  #    "백업 주기 × keep" 입니다. interval-minutes 를 바꾸면 여기도 같이 움직입니다.
  #    (30분 주기 + keep: 8 = 4시간. 15분 주기로 줄이면 2시간이 되고 해상도가 두 배 촘촘해집니다)
  #
  # ※ 각 계단은 앞 계단이 끝난 지점부터 "이어서" 과거로 갑니다.
  #    아래 예시에서 { every: 1h, keep: 10 } 은 최근 4시간 지점부터 10시간을 더 덮어
  #    결과적으로 14시간까지를 1시간 해상도로 남깁니다.
  #    keep: 1 짜리 계단은 그 구간 폭만큼을 통째로 잃는다는 뜻이니 주의하세요.
  #    (6h × 1 이면 그 시간대로 되돌릴 때 최대 6시간치를 잃습니다)
  #    실제 누적 범위는 /wb status 에서 계단별로 확인할 수 있습니다.
  #
  # ※ 백업 한 번마다 청크 저장을 기다리느라 서버가 잠깐 멈춥니다.
  #    콘솔의 "[백업] 청크 저장을 기다렸습니다 · <월드>: 2.8초" 를 보고 주기를 정하세요.
  #    월드가 여럿이면 합계도 함께 찍힙니다.
  #    한 월드가 10초를 넘으면 주기를 더 줄이는 것은 무리입니다. 주기를 늘리고 첫 계단만
  #    줄이거나, 그 월드를 위 worlds 에서 빼세요.
  #
  #    저장은 월드마다 틱을 나눠 돕니다. 워치독은 "틱 하나" 가 얼마나 걸렸는지를 보므로,
  #    셋을 한 틱에 몰면 그 합이 한 틱이 되어 스레드 덤프가 찍히고 합이 치명 임계에 닿으면
  #    서버가 죽습니다. 나눠도 멈추는 총량은 같지만 한 번에 멈추는 길이가 줄어듭니다.
  #
  # ※ 아래 기본값은 mode: differential 을 전제로 합니다. (그래서 위 기본값도 differential 입니다)
  #    mode: full 이면 이 27개가 전부 "월드 한 벌씩" 이라 디스크가 감당하지 못합니다.
  #    full 로 쓰시려면 keep 값을 크게 줄이거나 tiers 를 비우세요.
  #    두 값이 어긋나면 서버 시작 시 콘솔에 경고가 뜹니다.
  # 아래 "→" 는 그 계단까지 누적으로 덮는 범위입니다. (interval-minutes: 30 기준)
  tiers:
    - { every: 0,   keep: 8 }    # → 4시간    30분 해상도 (= 백업 주기 × keep)
    - { every: 1h,  keep: 10 }   # → 14시간   1시간 해상도  ← 자는 동안. 여기를 두껍게
    - { every: 6h,  keep: 2 }    # → 26시간
    - { every: 24h, keep: 3 }    # → 약 4일
    - { every: 72h, keep: 4 }    # → 약 16일

  # 백업 폴더 전체가 넘지 말아야 할 크기 (GB). 0 = 무제한
  #
  # ★ 호스팅(Pterodactyl 등)을 쓰신다면 반드시 넣으세요.
  #   아래 min-free-disk-gb 는 파일시스템에 남은 공간을 묻는데, 컨테이너 환경에서는
  #   그 값이 호스트 디스크를 가리켜 정작 걸려 있는 할당량을 보지 못합니다.
  #   그러면 백업이 할당량을 향해 자라도 아무도 막지 않습니다.
  #   이 값은 백업 폴더 크기를 직접 재므로 그런 환경에서도 동작하고,
  #   계단을 잘못 잡아 예상보다 많이 쌓이는 경우에도 마지막 방어선이 됩니다.
  #
  #   할당량의 절반 정도를 권장합니다. (월드 자체도 같은 할당량 안에 있습니다)
  #   예) 할당량 70GB -> 40
  #
  # 소수점도 됩니다. 작은 서버는 0.5 (=512MB) 처럼 잡으셔도 됩니다.
  #
  # /wb lock 으로 잠근 백업과 min-backups 는 이 상한보다 우선합니다.
  # 용량을 맞추려다 되돌릴 백업을 하나도 안 남기는 것이 더 나쁘기 때문입니다.
  max-total-size-gb: 0

  # ── 예전 방식 (tiers 를 비워 두면 이쪽이 동작) ─────────────────────
  # 보관할 최대 백업 개수 (0 = 무제한)
  max-backups: 48

  # 어떤 정책으로도 이 개수 아래로는 줄이지 않습니다. (0 = 하한 없음)
  #
  # 무인 서버에 반드시 필요한 안전망입니다. 접속자가 없으면 백업은 건너뛰지만 보관 정리는
  # 계속 돌기 때문에, 서버가 max-age-days 보다 오래 놀면 백업이 전부 사라질 수 있습니다.
  # (keep-daily 는 "최근 N일 안에 만들어진 백업"만 지키는데 그 기간에 백업이 없고,
  #  자동 백업은 protect-manual 대상도 아니기 때문입니다.)
  # 그 상태에서 누가 접속해 테러를 하면 되돌릴 백업이 하나도 없습니다.
  #
  # max-backups 보다 크게 잡으면 이 값이 이깁니다.
  min-backups: 5

  # 이 일수보다 오래된 백업은 삭제 (0 = 무제한)
  max-age-days: 14

  # 위 조건에 걸려도 "하루 중 가장 최근 백업"은 최근 N일치를 남깁니다.
  #
  # ※ 주의: "그 날의 마지막" 을 남기므로, 새벽에 테러당하고 하루가 지난 뒤 발견하면
  #   남아 있는 그 하루치 백업에 이미 피해가 들어 있습니다.
  #   그런 상황을 대비하려면 위 tiers 를 쓰세요.
  keep-daily: 7

  # 수동 백업(/wb backup)과 복원 직전 자동 백업은 자동 삭제하지 않습니다.
  protect-manual: true

  # 위에서 보호한 백업의 최대 개수. 넘으면 오래된 것부터 지웁니다. (0 = 무제한)
  # /wb lock 으로 직접 잠근 백업은 이 제한과 무관하게 영원히 남습니다.
  # 이 값이 없으면 수동/복원 직전 백업이 무한히 쌓여 디스크를 채웁니다.
  #
  # 위 tiers(또는 keep-daily)가 "이 시간대의 대표" 로 남기기로 한 백업은 이 상한으로
  # 지우지 않습니다. 그 자리를 비우면 계단이 약속한 시간대가 조용히 사라지는데,
  # 그 사실은 정작 되돌려야 하는 날에야 드러나기 때문입니다.
  max-protected: 10

  # 남은 디스크 공간이 이 값(GB) 미만이면 백업을 중단하고 경고합니다.
  # 위 max-total-size-gb 와 마찬가지로 소수점도 됩니다. (0.5 = 512MB)
  min-free-disk-gb: 5

restore:
  # /wb confirm 이후 서버 종료까지의 카운트다운 (초)
  countdown-seconds: 15

  # 복원 직전에 현재 상태를 한 번 더 백업합니다. (복원 취소용, 강력 권장)
  create-safety-backup: true

  # 기존 데이터를 지우기 전에 백업 zip 을 끝까지 읽어 무결성을 검사합니다. (강력 권장)
  # 깨진 백업으로 월드만 날리는 사고를 막아 줍니다.
  # 아카이브 크기에 비례해 복원 시간이 늘어납니다.
  verify-archive: true

  # 복원 시 교체되는 기존 파일을 지우지 않고
  # plugins/WorldBackUp/replaced/<시각>/ 로 옮겨 둡니다.
  keep-replaced-files: true

  # 위 replaced 스냅샷을 최근 몇 개까지 남길지. (0 = 무제한)
  # 복원 한 번에 월드 전체 크기만큼 쌓이므로 반드시 제한을 두세요.
  #
  # keep-replaced-files 가 켜져 있으면 복원에 "월드 한 벌만큼" 여유 공간이 더 필요합니다
  # (옛 파일을 지우지 않고 옮기므로 공간이 돌아오지 않습니다). 복원 전에 그 여유를
  # 확인해서, 모자라면 월드를 건드리기 전에 멈춥니다. 그때 이 값에 따라 오래된 replaced
  # 스냅샷을 먼저 정리해 자리를 만들어 보므로, 값이 작을수록 복원이 막힐 일이 줄어듭니다.
  keep-replaced-max: 3

  # /wb restore 후 /wb confirm 을 입력해야 하는 제한 시간 (초)
  confirm-timeout-seconds: 60

  # 복원 시 덮어쓰지 않고 그대로 둘 파일 패턴
  preserve:
    - "**/session.lock"

# ────────────────────────────────────────────────────────────────
# OneBack - 서버 한 벌을 통째로 담은 파일
# ────────────────────────────────────────────────────────────────
#
# 위의 backup 은 "이 서버를 어제로 되돌리기" 용입니다. 서버 폴더가 있다는 전제로,
# 월드와 설정만 담습니다.
#
# OneBack 은 다릅니다 - <b>이 폴더 하나만 챙기면 아무 데서나 서버를 다시 열 수 있는</b>
# 파일을 만듭니다. 서버 jar, eula.txt, server.properties, 모든 월드, 모든 플러그인(jar 와
# 데이터), 설정까지 서버 폴더에 있는 것을 통째로 담습니다.
#
# 이럴 때 씁니다:
#   - 호스팅을 옮길 때 (기존 업체에서 받아 새 업체에 풀면 끝)
#   - 서버 폴더가 통째로 날아갔을 때 (디스크 고장, 계정 정지, 실수로 삭제)
#   - 큰 변경 전에 "확실한 한 벌" 을 떠 둘 때
#
# 만들어진 폴더에는 zip 과 함께 읽어주세요.txt 가 들어갑니다. 다시 여는 방법이 적혀 있어
# 나중에 그 파일만 보고도 복구할 수 있습니다.
oneback:
  enabled: true

  # 저장 폴더. 상대 경로면 <b>서버 폴더</b> 기준입니다. (백업 폴더와 달리 plugins/ 기준이 아닙니다)
  # 다른 디스크나 외장 드라이브를 지정하면 서버 폴더가 통째로 날아가도 살아남습니다.
  #   directory: "OneBack"            -> 서버폴더/OneBack/
  #   directory: "D:/oneback"         -> 그 경로 그대로 (권장)
  directory: "OneBack"

  # 최근 몇 개까지 남길지. 한 개가 서버 폴더 크기만큼이므로 크게 잡지 마세요.
  #
  # 2 면 두 벌이 번갈아 갱신됩니다 - 새것을 만들고 가장 오래된 것을 지웁니다.
  # 만드는 동안에는 잠깐 세 벌만큼의 자리가 필요한데, 그 자리가 없으면 <b>먼저 가장 오래된
  # 것을 내주고</b> 만듭니다. 그렇게 하지 않으면 할당량이 빠듯한 호스팅에서 영영 새 아카이브를
  # 만들지 못하고, 폴더에는 낡은 것만 남습니다 - 자기 옛 사본이 자기 갱신을 막는 셈입니다.
  #
  # 다만 <b>마지막 한 벌은 절대 지우지 않습니다.</b> 그것을 지우고 만들다 실패하면 손에
  # 아무것도 남지 않는데, 이 파일은 서버가 통째로 사라졌을 때를 위한 것입니다.
  # 그 경우에는 만들지 않고 콘솔에 알립니다.
  keep: 2

  # 자동으로 만들 주기 (시간). 0 = 만들지 않음(/wb oneback 으로 직접 실행)
  #
  # 기본값이 0 인 이유: 한 번에 서버 폴더 크기만큼 쓰기 때문입니다. 자동으로 돌리시려면
  # 24 정도로 두고 keep 을 1~2 로 잡으세요. 접속자가 없고 바뀐 것도 없으면 건너뜁니다.
  interval-hours: 0

  # 여기서 뺄 경로 (서버 폴더 기준 glob).
  #
  # 로그·캐시·백업 폴더 자신은 적지 않아도 자동으로 빠집니다. libraries/ 와 versions/ 는
  # <b>일부러 담습니다</b> - 그게 있어야 인터넷 없이도 그 자리에서 서버가 뜹니다.
  exclude:
    - "**/logs/**"
    - "**/crash-reports/**"
    - "**/*.log"
    - "**/*.log.gz"

# ────────────────────────────────────────────────────────────────
# 업데이트 확인
# ────────────────────────────────────────────────────────────────
#
# 이 플러그인은 jar 하나만 갈아 끼우면 업데이트됩니다. 그런데 새 버전이 나온 줄
# 모르면 그 편의가 소용없습니다. 여기서 확인해 알려 줍니다.
update:
  # 서버를 켤 때 새 버전이 있는지 깃허브에 물어봅니다. (확인만, 내려받지 않습니다)
  # 실패해도 서버에는 아무 영향이 없습니다.
  check: true

  # true 면 새 버전을 찾았을 때 <b>자동으로 내려받아</b> plugins/update/ 에 둡니다.
  # 다음 재시작에 서버가 알아서 갈아 끼웁니다. (돌고 있는 jar 는 건드리지 않습니다)
  #
  # ※ 켜기 전에 생각해 보세요. 이 값이 true 면 서버는 앞으로 아래 저장소에 올라오는
  #   코드를 사람 확인 없이 받아서 실행합니다. 저장소 계정이 털리면 그대로 따라갑니다.
  #   기본값이 false 인 이유입니다. 필요할 때 /wb update 로 직접 받는 편이 안전합니다.
  auto-download: false

  # 확인할 깃허브 저장소. (소유자/저장소)
  repository: "bouz3337-cell/WorldBackUp"
