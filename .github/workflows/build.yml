# 테스트가 145개 넘게 있어도 자동으로 돌지 않으면 "돌렸다고 믿는 것"에 그친다.
# 이 플러그인이 검증하는 것들은 대부분 "잘못되면 조용히 데이터를 잃는" 분기라
# 회귀를 사람 손에 맡기지 않는다.
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 커밋된 gradle-wrapper.jar 가 공식 배포본인지 확인한다. 이 파일은 빌드가 실행하는
      # 바이너리라, 바뀐 것을 눈으로 알아채기 어렵다.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 26.1 부터 마인크래프트는 Java 25 를 요구한다 (build.gradle.kts 의 toolchain 과 같은 값).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      # 실패했을 때 어느 테스트가 왜 깨졌는지 로그만 보고 좁히기 어려운 경우가 있다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
